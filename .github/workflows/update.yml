name: Actualización semanal de datos
on:
  schedule:
    # Lunes a las 04:23 UTC (05:23 o 06:23 en Madrid), con los BOE del fin de semana ya publicados.
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actualizacion-datos
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cambios: ${{ steps.commit.outputs.cambios }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      # Caché de respuestas (no versionada): evita volver a pedir cada semana las legislaturas y los años cerrados.
      - uses: actions/cache@v6.1.0
        with:
          path: data/raw/cache
          key: fuentes-${{ github.run_id }}
          restore-keys: fuentes-
      - name: Recoger y validar (los errores de validación detienen la publicación)
        run: python3 -m pipeline.build --fetch
      - run: python3 -m pipeline.metrics
      - run: python3 -m pipeline.export_web
      - run: python3 -m unittest discover -s pipeline/tests -t .
      - name: Guardar los datos nuevos
        id: commit
        run: |
          git add data/interim data/clean data/derived data/audit.json public/data
          if git diff --cached --quiet; then
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los datos." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos: actualización semanal $(date -u +%F)"
          git push
          echo "cambios=true" >> "$GITHUB_OUTPUT"
          python3 -c "import json; a=json.load(open('data/audit.json')); print('RDL:', a['meta']['n_rdl'])" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: update
    if: needs.update.outputs.cambios == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
